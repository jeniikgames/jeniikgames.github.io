<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2F57"/><stop offset="1" stop-color="#14213D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <!-- legenda (oranžová) se šipkou -->
    <rect x="76" y="92" width="168" height="168" rx="32" fill="#B87400"/>
    <rect x="76" y="80" width="168" height="168" rx="32" fill="#FCA311"/>
    <text x="160" y="205" font-size="122" fill="#2A1A00">Č</text>
    <!-- políčka s písmeny -->
    <rect x="268" y="92" width="168" height="168" rx="32" fill="#C9D1E2"/>
    <rect x="268" y="80" width="168" height="168" rx="32" fill="#FFFFFF"/>
    <text x="352" y="205" font-size="122" fill="#14213D">K</text>
    <rect x="76" y="284" width="168" height="168" rx="32" fill="#C9D1E2"/>
    <rect x="76" y="272" width="168" height="168" rx="32" fill="#FFFFFF"/>
    <text x="160" y="397" font-size="122" fill="#14213D">Ř</text>
    <rect x="268" y="284" width="168" height="168" rx="32" fill="#2B7BB0"/>
    <rect x="268" y="272" width="168" height="168" rx="32" fill="#4CC9F0"/>
    <text x="352" y="397" font-size="122" fill="#0B2540">?</text>
    <!-- číslo tajenky -->
    <circle cx="420" cy="96" r="40" fill="#E63946" stroke="#14213D" stroke-width="10"/>
    <text x="420" y="116" font-size="56" fill="#fff">1</text>
  </g>
</svg>
